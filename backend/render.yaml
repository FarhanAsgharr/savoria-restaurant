# Render Blueprint — one-click deploy of the API + PostgreSQL.
# In Render: New → Blueprint → pick this repo. Docs: render.com/docs/blueprint-spec
services:
  - type: web
    name: savoria-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: SECRET_KEY
        generateValue: true # Render generates a strong secret automatically
      - key: DEBUG
        value: "False"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      # ALLOWED_HOSTS + CSRF are auto-configured from RENDER_EXTERNAL_HOSTNAME.
      # Admin user is created on deploy from these:
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@savoria.app
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false # ← you set this in the Render dashboard (choose a password)
      # Optional: your Vercel URL, so the admin "VIEW SITE" link works.
      - key: FRONTEND_URL
        sync: false
      # DATABASE_URL points to a permanent Supabase Postgres (NOT a Render free
      # DB, which expires after 30 days). Paste the Supabase *Session pooler*
      # connection string (port 5432) in the Render dashboard when deploying.
      - key: DATABASE_URL
        sync: false
